<style>
*{box-sizing:border-box} :root{--ink:#293044;--muted:#697087;--purple:#7058e8;--purple2:#8b75f3;--yellow:#ffd45b;--mint:#61d7b0;--pink:#ff8fa3;--paper:#fffdfa;--line:#e8e3da;--shadow:0 8px 24px rgba(69,55,35,.09)}
body{margin:0;background:linear-gradient(180deg,#fff8e7 0,#f8f5ff 55%,#effaf7 100%);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}.app{width:min(100%,520px);min-height:100vh;margin:auto;padding:20px 16px calc(36px + env(safe-area-inset-bottom))}.screen{display:none}.screen.active{display:block}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hero{position:relative;display:flex;align-items:center;gap:13px;padding:15px 4px 22px}.hero h1{font-family:Jua,sans-serif;font-size:34px;line-height:1;margin:3px 0;color:#4c3bb2;letter-spacing:-1px}.eyebrow{font-size:12px;font-weight:800;color:#827a68;margin:0}.mascot{display:grid;place-items:center;width:64px;height:64px;border-radius:20px 20px 26px 26px;background:var(--yellow);color:#684f08;font:42px/1 Jua;transform:rotate(-3deg);box-shadow:0 7px 0 #e5b836}.icon-btn{position:absolute;right:0;top:0;width:42px;height:42px;border:0;border-radius:15px;background:#fff;color:#666;font-size:18px;box-shadow:var(--shadow)}
.panel,.summary-box,.card,.quiz-card{background:rgba(255,255,255,.92);border:2px solid #fff;border-radius:24px;padding:20px;box-shadow:var(--shadow)}.lesson-panel{position:relative;padding-top:24px}.step-badge{position:absolute;top:-13px;left:20px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;font-weight:800;border:3px solid #fff}.panel-title-wrap h2,.request-box h2{font-size:18px;margin:0 0 14px}.panel-title-wrap{padding-left:35px}
input,select{width:100%;height:56px;border:2px solid #ddd8f6;border-radius:16px;background:#faf9ff;color:var(--ink);padding:0 16px;font-size:17px;font-weight:700;outline:none}input:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 4px rgba(112,88,232,.12)}
.action-grid{display:grid;gap:12px;margin:16px 0}.action-card{display:flex;align-items:center;gap:15px;width:100%;min-height:83px;padding:13px 18px;border:0;border-radius:22px;text-align:left;color:var(--ink);box-shadow:var(--shadow);transition:transform .12s}.action-card:active{transform:scale(.98)}.action-card span:last-child{display:grid}.action-card strong{font-size:19px}.action-card small{font-size:13px;margin-top:3px;color:#596078}.action-icon{display:grid;place-items:center;flex:0 0 52px;height:52px;background:rgba(255,255,255,.75);border-radius:17px;font-size:27px}.study-action{background:#fff0a8}.quiz-action{background:#dcd4ff}.note-action{background:#c7f3e4}
.home-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px}.home-summary>div{display:flex;align-items:center;gap:10px}.summary-icon{font-size:26px}.home-summary small{color:var(--muted);font-weight:700}.home-summary p{margin:2px 0 0;font-size:14px;font-weight:800}.compact-btn{width:auto;min-height:46px;padding:0 15px;border:0;border-radius:14px;background:var(--purple);color:#fff;font-weight:800;white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 22px}.top-buttons{display:flex;gap:8px}.back-btn,.mini-btn{width:auto;min-height:44px;padding:0 14px;border:0;border-radius:14px;background:#fff;color:var(--ink);font-weight:800;box-shadow:var(--shadow)}.progress-pill{margin:0;background:#ebe7ff;color:#5d47cc;padding:8px 13px;border-radius:999px;font-weight:800}.study-label{text-align:center;font-weight:800;color:var(--muted)}
.study-card{position:relative;text-align:center;min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(150deg,#fff,#f4f0ff);margin:18px 0}.speaker-btn{position:absolute;right:16px;top:16px;width:48px;height:48px;border:0;border-radius:16px;background:#eeeaff;font-size:22px}.word{font:48px/1.1 Jua,sans-serif;color:#4735b3;word-break:break-word}.meaning{font-size:25px;font-weight:800;margin-top:22px}.button-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.button-row button,.result-screen>button{min-height:56px;border:0;border-radius:17px;background:var(--purple);color:#fff;font-weight:800;font-size:16px}.secondary{background:#fff!important;color:var(--ink)!important;border:2px solid #e2deef!important}
.section-heading{text-align:center;margin:28px 0}.section-heading>span,.celebration{font-size:44px}.section-heading h1,.result-screen h1{font:34px/1.2 Jua;margin:8px 0;color:#4939af}.section-heading p{color:var(--muted);font-weight:700;margin:0}.quiz-type-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quiz-type-btn{min-height:145px;border:0;border-radius:23px;background:#fff;padding:17px 10px;box-shadow:var(--shadow);color:var(--ink)}.quiz-type-btn span{display:block;font-size:35px}.quiz-type-btn strong{display:block;font-size:16px;margin-top:8px}.quiz-type-btn small{display:block;font-size:11px;color:var(--muted);margin-top:5px}.random-type{grid-column:1/-1;min-height:110px;background:#fff1ae}.quiz-card{text-align:center;padding:24px 18px}.quiz-type{display:inline-block;padding:7px 12px;border-radius:99px;background:#eeeaff;color:#5b45c5;font-size:13px;font-weight:800}.quiz-question{font:32px/1.25 Jua,sans-serif;min-height:90px;display:grid;place-items:center;margin:18px 0}.speaker-wide{width:100%;min-height:52px;border:0;border-radius:16px;background:#fff0b4;color:#54431a;font-weight:800}.choice-list{display:grid;gap:11px;margin-top:18px}.choice-btn{min-height:58px;border:2px solid #e4e0ef;border-radius:17px;background:#fff;text-align:left;padding:0 18px;font-size:17px;font-weight:800;color:var(--ink)}.choice-btn.correct{border-color:#28b886;background:#dcf8ef;color:#087554}.choice-btn.wrong{border-color:#f16c84;background:#ffeaee;color:#b92e49}.result{min-height:34px;margin-top:13px;font-size:19px;font-weight:800}.result.correct{color:#14946b}.result.wrong{color:#df4561}
.result-screen{text-align:center;padding-top:70px}.celebration{font-size:65px}.result-screen .summary-box{margin:24px 0}.result-screen>button{width:100%;margin-top:10px}.text-btn{border:0!important;background:transparent!important;color:#6556b5!important;box-shadow:none!important;font-weight:800}.wrong-list{display:grid;gap:12px}.wrong-item{background:#fff;border-radius:20px;padding:17px;box-shadow:var(--shadow);font-size:17px;font-weight:700}.wrong-item button{width:100%;min-height:46px;margin-top:10px;border:0;border-radius:14px;background:#eeeaff;color:#5846bd;font-weight:800}.input-row{display:flex;gap:8px}.input-row .compact-btn{min-width:82px}.request-box{margin-top:16px}.request-header,.request-row{display:grid;grid-template-columns:1fr 55px 72px;gap:6px;align-items:center}.request-header{font-size:12px;color:var(--muted);font-weight:800;margin:13px 0 7px}.request-row{background:#f8f7fb;border-radius:13px;padding:10px;font-size:13px;margin-top:7px}.request-status{padding:5px;border-radius:99px;text-align:center;font-weight:800}.approved{color:#087554;background:#dcf8ef}.rejected{color:#b92e49;background:#ffeaee}.pending{color:#7c6415;background:#fff2b8}.admin-request-list{display:grid;gap:10px}.admin-request-row{background:#f7f6fb;border-radius:15px;padding:12px}.admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.admin-actions button,#adminLoginBtn{min-height:48px;border:0;border-radius:14px;background:var(--purple);color:#fff;font-weight:800;margin-top:10px;width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);width:min(calc(100% - 32px),480px);padding:14px 18px;border-radius:16px;background:#293044;color:#fff;text-align:center;font-weight:700;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:370px){.app{padding-inline:12px}.hero h1{font-size:30px}.quiz-type-buttons{grid-template-columns:1fr}.random-type{grid-column:auto}.word{font-size:42px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
